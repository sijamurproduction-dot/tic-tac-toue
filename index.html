    <!-- Custom Neon Glows -->
    <style>
        * {
            font-family: 'Outfit', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Glassmorphic Background Effect */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .glass-button {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.2s ease-in-out;
            position: relative;
            overflow: hidden;
        }
        .glass-button:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.18);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
        }
        .glass-button:active:not(:disabled) {
            transform: translateY(0);
        }

        /* Ripple effect on click */
        .ripple-effect {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0);
            animation: ripple 0.5s linear;
            pointer-events: none;
        }
        @keyframes ripple {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Custom Neon Glows */
        .glow-x {
            text-shadow: 0 0 15px rgba(6, 182, 212, 0.9), 0 0 30px rgba(6, 182, 212, 0.5);
        }
        .glow-o {
            text-shadow: 0 0 15px rgba(236, 72, 153, 0.9), 0 0 30px rgba(236, 72, 153, 0.5);
        }

        .box-glow-x {
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.5), inset 0 0 15px rgba(6, 182, 212, 0.25);
            border-color: rgba(6, 182, 212, 0.7) !important;
        }
        .box-glow-o {
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.5), inset 0 0 15px rgba(236, 72, 153, 0.25);
            border-color: rgba(236, 72, 153, 0.7) !important;
        }

        /* Floating background particles canvas */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
        }

        /* Winning Line Canvas */
        #winLineCanvas {
            pointer-events: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
        }

        /* Cell animations */
        .cell-pop {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn {
            0% { transform: scale(0) rotate(-10deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        /* Custom Slider Styling */
        input[type="range"] {
            accent-color: #06b6d4;
        }
    </style>
</head>

    <!-- Game Logic JavaScript -->
    <script>
        // --- Floating Ambient Particle Background Canvas ---
        const bgCanvas = document.getElementById('bgCanvas');
        const bgCtx = bgCanvas.getContext('2d');
        let particles = [];

        function initBgCanvas() {
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
            particles = [];
            const count = Math.floor((bgCanvas.width * bgCanvas.height) / 18000);
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: Math.random() * bgCanvas.width,
                    y: Math.random() * bgCanvas.height,
                    radius: Math.random() * 2 + 0.5,
                    color: Math.random() > 0.5 ? 'rgba(6, 182, 212, ' : 'rgba(236, 72, 153, ',
                    alpha: Math.random() * 0.4 + 0.1,
                    speedX: (Math.random() - 0.5) * 0.4,
                    speedY: (Math.random() - 0.5) * 0.4
                });
            }
        }

        function animateBgParticles() {
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
            particles.forEach(p => {
                p.x += p.speedX;
                p.y += p.speedY;

                if (p.x < 0) p.x = bgCanvas.width;
                if (p.x > bgCanvas.width) p.x = 0;
                if (p.y < 0) p.y = bgCanvas.height;
                if (p.y > bgCanvas.height) p.y = 0;

                bgCtx.beginPath();
                bgCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                bgCtx.fillStyle = p.color + p.alpha + ')';
                bgCtx.fill();
            });
            requestAnimationFrame(animateBgParticles);
        }

        window.addEventListener('resize', initBgCanvas);
        initBgCanvas();
        animateBgParticles();

        // --- Web Audio API Synth Engine (SFX & Procedural Lo-Fi BGM) ---
        class AudioEngine {
            constructor() {
                this.ctx = null;
                this.sfxEnabled = true;
                this.bgmEnabled = true;
                this.bgmVolume = 0.3;
                this.bgmGainNode = null;
                this.bgmInterval = null;
                this.isBgmPlaying = false;
                this.step = 0;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            // --- SFX Section ---
            playClick() {
                if (!this.sfxEnabled) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, this.ctx.currentTime + 0.04);
                gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.04);
            }

            playMove(isX) {
                if (!this.sfxEnabled) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);

                if (isX) {
                    // X Sound: Crisp high-pitch cyan pluck
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, this.ctx.currentTime); // C5
                    osc.frequency.exponentialRampToValueAtTime(659.25, this.ctx.currentTime + 0.09); // E5
                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.09);
                } else {
                    // O Sound: Warm pink synth drop
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(392.00, this.ctx.currentTime); // G4
                    osc.frequency.exponentialRampToValueAtTime(293.66, this.ctx.currentTime + 0.1); // D4
                    gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.1);
                }

                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            }

            playWin() {
                if (!this.sfxEnabled) return;
                this.init();
                // Celebratory Arpeggio Fanfare
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.08);

                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.08 + 0.3);

                    osc.start(this.ctx.currentTime + idx * 0.08);
                    osc.stop(this.ctx.currentTime + idx * 0.08 + 0.3);
                });
            }

            playDraw() {
                if (!this.sfxEnabled) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(261.63, this.ctx.currentTime); // C4
                osc.frequency.exponentialRampToValueAtTime(130.81, this.ctx.currentTime + 0.3); // C3

                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }

            // --- Ambient Lo-Fi / Synthwave BGM Generator ---
            startBgm() {
                if (this.isBgmPlaying || !this.bgmEnabled) return;
                this.init();
                this.isBgmPlaying = true;

                this.bgmGainNode = this.ctx.createGain();
                this.bgmGainNode.gain.setValueAtTime(this.bgmVolume, this.ctx.currentTime);
                this.bgmGainNode.connect(this.ctx.destination);

                // Ambient chord progression frequency pairs (Soft Lo-fi Synth pad)
                const chords = [
                    [261.63, 329.63, 392.00], // C major
                    [220.00, 261.63, 329.63], // A minor
                    [174.61, 220.00, 261.63], // F major
                    [196.00, 246.94, 293.66]  // G major
                ];

                this.step = 0;
                this.bgmInterval = setInterval(() => {
                    if (!this.isBgmPlaying) return;

                    const currentChord = chords[Math.floor(this.step / 4) % chords.length];
                    const note = currentChord[this.step % currentChord.length];

                    const osc = this.ctx.createOscillator();
                    const noteGain = this.ctx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(note, this.ctx.currentTime);

                    noteGain.gain.setValueAtTime(0.05, this.ctx.currentTime);
                    noteGain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 1.2);

                    osc.connect(noteGain);
                    noteGain.connect(this.bgmGainNode);

                    osc.start();
                    osc.stop(this.ctx.currentTime + 1.2);

                    this.step++;
                }, 600);
            }

            stopBgm() {
                this.isBgmPlaying = false;
                if (this.bgmInterval) {
                    clearInterval(this.bgmInterval);
                    this.bgmInterval = null;
                }
            }

            setVolume(val) {
                this.bgmVolume = val;
                if (this.bgmGainNode && this.ctx) {
                    this.bgmGainNode.gain.setValueAtTime(val, this.ctx.currentTime);
                }
            }
        }

        const audio = new AudioEngine();

        // Autoplay Audio on First User Click Interaction
        const enableAudioOnFirstTouch = () => {
            audio.init();
            if (audio.bgmEnabled && !audio.isBgmPlaying) {
                audio.startBgm();
            }
            window.removeEventListener('click', enableAudioOnFirstTouch);
            window.removeEventListener('keydown', enableAudioOnFirstTouch);
        };
        window.addEventListener('click', enableAudioOnFirstTouch);
        window.addEventListener('keydown', enableAudioOnFirstTouch);

        // --- Game Logic ---
        let boardState = Array(9).fill('');
        let currentPlayer = 'X';
        let gameActive = true;
        let isAiMode = false;
        let aiDifficulty = 'hard';
        let scores = { X: 0, O: 0, Draw: 0 };

        const WINNING_COMBOS = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        // --- DOM Elements ---
        const boardEl = document.getElementById('board');
        const modePvpBtn = document.getElementById('modePvpBtn');
        const modeAiBtn = document.getElementById('modeAiBtn');
        const difficultyContainer = document.getElementById('difficultyContainer');
        const diffBtns = document.querySelectorAll('.diff-btn');
        const turnText = document.getElementById('turnText');
        const turnBadge = document.getElementById('turnBadge');
        const scoreXEl = document.getElementById('scoreX');
        const scoreOEl = document.getElementById('scoreO');
        const scoreDrawEl = document.getElementById('scoreDraw');
        const labelOEl = document.getElementById('labelO');
        const resetGameBtn = document.getElementById('resetGameBtn');
        const resetScoreBtn = document.getElementById('resetScoreBtn');
        const soundToggleBtn = document.getElementById('soundToggleBtn');
        const soundIcon = document.getElementById('soundIcon');
        const bgmToggleBtn = document.getElementById('bgmToggleBtn');
        const bgmIcon = document.getElementById('bgmIcon');
        const bgmVolumeSlider = document.getElementById('bgmVolumeSlider');
        const canvas = document.getElementById('winLineCanvas');
        const ctx = canvas.getContext('2d');

        lucide.createIcons();

        // Ripple Effect on Button Click
        function createRipple(event, targetElement) {
            const circle = document.createElement('span');
            const diameter = Math.max(targetElement.clientWidth, targetElement.clientHeight);
            const radius = diameter / 2;
            const rect = targetElement.getBoundingClientRect();

            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `${event.clientX - rect.left - radius}px`;
            circle.style.top = `${event.clientY - rect.top - radius}px`;
            circle.classList.add('ripple-effect');

            const ripple = targetElement.getElementsByClassName('ripple-effect')[0];
            if (ripple) ripple.remove();

            targetElement.appendChild(circle);
        }

        function createBoard() {
            boardEl.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                const cell = document.createElement('button');
                cell.classList.add(
                    'glass-button', 'rounded-2xl', 'flex', 'items-center', 'justify-center', 
                    'text-4xl', 'font-extrabold', 'transition-all', 'duration-200', 'h-full', 'w-full'
                );
                cell.dataset.index = i;
                cell.addEventListener('click', (e) => {
                    createRipple(e, cell);
                    handleCellClick(i);
                });
                boardEl.appendChild(cell);
            }
            resizeCanvas();
        }

        function resizeCanvas() {
            const rect = boardEl.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }
        window.addEventListener('resize', resizeCanvas);

        function handleCellClick(index) {
            if (boardState[index] !== '' || !gameActive) return;
            if (isAiMode && currentPlayer === 'O') return;

            makeMove(index, currentPlayer);

            if (gameActive && isAiMode && currentPlayer === 'O') {
                setTimeout(() => {
                    makeAiMove();
                }, 400);
            }
        }

        function makeMove(index, player) {
            boardState[index] = player;
            const cell = boardEl.children[index];

            if (player === 'X') {
                cell.innerHTML = `<span class="cell-pop text-cyan-400 glow-x">X</span>`;
                cell.classList.add('box-glow-x');
            } else {
                cell.innerHTML = `<span class="cell-pop text-pink-400 glow-o">O</span>`;
                cell.classList.add('box-glow-o');
            }

            audio.playMove(player === 'X');

            const winCombo = checkWin(boardState, player);
            if (winCombo) {
                endGame(player, winCombo);
                return;
            }

            if (boardState.every(c => c !== '')) {
                endGame('Draw');
                return;
            }

            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            updateTurnDisplay();
        }

        function updateTurnDisplay() {
            if (currentPlayer === 'X') {
                turnBadge.className = "flex items-center gap-1.5 font-bold text-cyan-400";
                turnText.textContent = "Pemain X";
            } else {
                turnBadge.className = "flex items-center gap-1.5 font-bold text-pink-400";
                turnText.textContent = isAiMode ? "AI (O)" : "Pemain O";
            }
        }

        function checkWin(board, player) {
            for (let combo of WINNING_COMBOS) {
                if (combo.every(idx => board[idx] === player)) {
                    return combo;
                }
            }
            return null;
        }

        function endGame(winner, combo = null) {
            gameActive = false;

            if (winner === 'Draw') {
                scores.Draw++;
                scoreDrawEl.textContent = scores.Draw;
                turnBadge.className = "flex items-center gap-1.5 font-bold text-amber-400";
                turnText.textContent = "Permainan Seri!";
                audio.playDraw();
            } else {
                scores[winner]++;
                if (winner === 'X') scoreXEl.textContent = scores.X;
                if (winner === 'O') scoreOEl.textContent = scores.O;

                const winnerLabel = winner === 'X' ? 'Pemain X' : (isAiMode ? 'AI (O)' : 'Pemain O');
                turnBadge.className = `flex items-center gap-1.5 font-bold ${winner === 'X' ? 'text-cyan-400' : 'text-pink-400'}`;
                turnText.textContent = `${winnerLabel} Menang! 🎉`;

                drawWinningLine(combo, winner === 'X' ? '#06b6d4' : '#ec4899');
                audio.playWin();
                triggerConfetti();
            }
        }

        function drawWinningLine(combo, color) {
            const cells = boardEl.children;
            const startCell = cells[combo[0]].getBoundingClientRect();
            const endCell = cells[combo[2]].getBoundingClientRect();
            const boardRect = boardEl.getBoundingClientRect();

            const startX = startCell.left + startCell.width / 2 - boardRect.left;
            const startY = startCell.top + startCell.height / 2 - boardRect.top;
            const endX = endCell.left + endCell.width / 2 - boardRect.left;
            const endY = endCell.top + endCell.height / 2 - boardRect.top;

            let progress = 0;

            function animateLine() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.lineTo(startX + (endX - startX) * progress, startY + (endY - startY) * progress);
                ctx.strokeStyle = color;
                ctx.lineWidth = 8;
                ctx.lineCap = 'round';
                ctx.shadowColor = color;
                ctx.shadowBlur = 20;
                ctx.stroke();

                if (progress < 1) {
                    progress += 0.12;
                    requestAnimationFrame(animateLine);
                }
            }
            animateLine();
        }

        function clearWinningLine() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function triggerConfetti() {
            confetti({
                particleCount: 100,
                spread: 80,
                origin: { y: 0.6 }
            });
        }

        // --- AI Logics ---
        function makeAiMove() {
            let index;
            if (aiDifficulty === 'easy') {
                index = getRandomMove();
            } else if (aiDifficulty === 'medium') {
                index = Math.random() < 0.5 ? getBestMove() : getRandomMove();
            } else {
                index = getBestMove();
            }

            if (index !== null && index !== undefined) {
                makeMove(index, 'O');
            }
        }

        function getRandomMove() {
            const available = boardState.map((val, idx) => val === '' ? idx : null).filter(val => val !== null);
            return available.length > 0 ? available[Math.floor(Math.random() * available.length)] : null;
        }

        function getBestMove() {
            let bestScore = -Infinity;
            let move = null;

            for (let i = 0; i < 9; i++) {
                if (boardState[i] === '') {
                    boardState[i] = 'O';
                    let score = minimax(boardState, 0, false);
                    boardState[i] = '';
                    if (score > bestScore) {
                        bestScore = score;
                        move = i;
                    }
                }
            }
            return move;
        }

        function minimax(board, depth, isMaximizing) {
            const winO = checkWin(board, 'O');
            const winX = checkWin(board, 'X');

            if (winO) return 10 - depth;
            if (winX) return depth - 10;
            if (board.every(cell => cell !== '')) return 0;

            if (isMaximizing) {
                let bestScore = -Infinity;
                for (let i = 0; i < 9; i++) {
                    if (board[i] === '') {
                        board[i] = 'O';
                        let score = minimax(board, depth + 1, false);
                        board[i] = '';
                        bestScore = Math.max(score, bestScore);
                    }
                }
                return bestScore;
            } else {
                let bestScore = Infinity;
                for (let i = 0; i < 9; i++) {
                    if (board[i] === '') {
                        board[i] = 'X';
                        let score = minimax(board, depth + 1, true);
                        board[i] = '';
                        bestScore = Math.min(score, bestScore);
                    }
                }
                return bestScore;
            }
        }

        // --- Controls & Event Listeners ---
        function resetGame() {
            boardState = Array(9).fill('');
            gameActive = true;
            currentPlayer = 'X';
            clearWinningLine();
            updateTurnDisplay();

            Array.from(boardEl.children).forEach(cell => {
                cell.innerHTML = '';
                cell.className = 'glass-button rounded-2xl flex items-center justify-center text-4xl font-extrabold transition-all duration-200 h-full w-full';
            });
        }

        function resetScore() {
            scores = { X: 0, O: 0, Draw: 0 };
            scoreXEl.textContent = '0';
            scoreOEl.textContent = '0';
            scoreDrawEl.textContent = '0';
            resetGame();
        }

        // Controls Event Handlers
        modePvpBtn.addEventListener('click', (e) => {
            audio.playClick();
            isAiMode = false;
            modePvpBtn.className = "flex-1 py-2 rounded-lg text-sm font-semibold transition-all duration-300 flex items-center justify-center gap-2 bg-gradient-to-r from-cyan-600 to-blue-600 text-white shadow";
            modeAiBtn.className = "flex-1 py-2 rounded-lg text-sm font-semibold transition-all duration-300 flex items-center justify-center gap-2 text-slate-400 hover:text-white";
            difficultyContainer.classList.add('hidden');
            labelOEl.textContent = "Pemain O";
            resetScore();
        });

        modeAiBtn.addEventListener('click', (e) => {
            audio.playClick();
            isAiMode = true;
            modeAiBtn.className = "flex-1 py-2 rounded-lg text-sm font-semibold transition-all duration-300 flex items-center justify-center gap-2 bg-gradient-to-r from-pink-600 to-purple-600 text-white shadow";
            modePvpBtn.className = "flex-1 py-2 rounded-lg text-sm font-semibold transition-all duration-300 flex items-center justify-center gap-2 text-slate-400 hover:text-white";
            difficultyContainer.classList.remove('hidden');
            labelOEl.textContent = "AI (O)";
            resetScore();
        });

        diffBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                audio.playClick();
                diffBtns.forEach(b => {
                    b.className = "diff-btn px-2.5 py-1 rounded-md text-xs font-medium text-slate-400 hover:text-white transition";
                });
                const selectedDiff = e.target.dataset.diff;
                aiDifficulty = selectedDiff;

                if (selectedDiff === 'easy') {
                    e.target.className = "diff-btn px-2.5 py-1 rounded-md text-xs font-medium bg-green-500/20 text-green-400 border border-green-500/30 font-semibold transition";
                } else if (selectedDiff === 'medium') {
                    e.target.className = "diff-btn px-2.5 py-1 rounded-md text-xs font-medium bg-yellow-500/20 text-yellow-400 border border-yellow-500/30 font-semibold transition";
                } else {
                    e.target.className = "diff-btn px-2.5 py-1 rounded-md text-xs font-medium bg-pink-500/20 text-pink-400 border border-pink-500/30 font-semibold transition";
                }
                resetGame();
            });
        });

        soundToggleBtn.addEventListener('click', () => {
            audio.sfxEnabled = !audio.sfxEnabled;
            if (audio.sfxEnabled) {
                soundIcon.setAttribute('data-lucide', 'volume-2');
                soundToggleBtn.classList.remove('opacity-50');
                audio.playClick();
            } else {
                soundIcon.setAttribute('data-lucide', 'volume-x');
                soundToggleBtn.classList.add('opacity-50');
            }
            lucide.createIcons();
        });

        bgmToggleBtn.addEventListener('click', () => {
            audio.bgmEnabled = !audio.bgmEnabled;
            if (audio.bgmEnabled) {
                bgmIcon.setAttribute('data-lucide', 'music');
                bgmToggleBtn.classList.remove('opacity-50');
                audio.startBgm();
            } else {
                bgmIcon.setAttribute('data-lucide', 'music-2');
                bgmToggleBtn.classList.add('opacity-50');
                audio.stopBgm();
            }
            lucide.createIcons();
        });

        bgmVolumeSlider.addEventListener('input', (e) => {
            audio.setVolume(parseFloat(e.target.value));
        });

        resetGameBtn.addEventListener('click', () => {
            audio.playClick();
            resetGame();
        });

        resetScoreBtn.addEventListener('click', () => {
            audio.playClick();
            resetScore();
        });

        window.onload = () => {
            createBoard();
        };
    </script>
</body>
</html>
